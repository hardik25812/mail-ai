# Supabase configuration file

# Project settings
project_id = "mail-ai"
organization_id = "mail-ai-org"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://localhost:54321"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

[functions]
[functions.emails]
verify_jwt = true

[functions.settings]
verify_jwt = true

[functions.campaigns]
verify_jwt = true

[functions.senders]
verify_jwt = true

[functions.timezones]
verify_jwt = false

[functions.sync]
verify_jwt = false
